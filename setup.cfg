[metadata]
name = robot-toolkit
version = 0.1.0

[options]
packages = find:
python_requires = >=3.10

[options.packages.find]
where = .

[tool:pytest]
testpaths = test
addopts = -v --tb=short

[coverage:run]
source = robot_toolkit
omit = 
    */tests/*
    */test_*.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
